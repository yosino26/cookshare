amazon: &amazon
  service: S3
  access_key_id:     <%= ENV["AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"] %>
  region:            <%= ENV["AWS_REGION"] %>
  bucket:            <%= ENV["AWS_S3_BUCKET"] %>
  # public: false がデフォルト扱い（推奨：非公開）
  # force_path_style: false  # 通常は不要

# 環境ごとにバケットを分けたい場合は、ENVで切替が簡単
amazon_staging:
  <<: *amazon
