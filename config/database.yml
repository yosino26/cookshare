default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  # ↓ 開発/テスト用のデフォルト接続先（必要に応じてENVで上書き）
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: cookshare_dev

test:
  <<: *default
  database: cookshare_test

# 本番はRenderの Environment で設定した DATABASE_URL を利用
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
