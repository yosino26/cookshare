name: RSpec

on:
  pull_request:
  push:
    branches: [ main ]
  # 任意：特定のspec/ディレクトリだけを手動で回したい時に使う
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Spec file or directory to run (e.g. spec/requests/admin)'
        required: false
        default: ''

# 連投Push時に古いジョブをキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cookshare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cookshare_test
      DISABLE_SPRING: 1

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.0'
          bundler-cache: true

      - name: Setup DB
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      # 変更された領域を検出（ここがキモ）
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            system:
              - 'spec/system/**'
              - 'spec/support/capybara.rb'
              - 'spec/support/**'
            admin:
              - 'app/controllers/admin/**'
              - 'app/views/admin/**'
              - 'spec/requests/admin/**'
            favorites:
              - 'app/controllers/**/favorites*'
              - 'app/models/favorite.rb'
              - 'spec/requests/favorites_spec.rb'
            ratings:
              - 'app/controllers/**/ratings*'
              - 'app/models/rating.rb'
              - 'spec/requests/ratings_spec.rb'
            reports:
              - 'app/controllers/**/reports*'
              - 'app/models/report.rb'
              - 'spec/requests/reports_spec.rb'
            users:
              - 'app/controllers/**/users*'
              - 'app/models/user.rb'
              - 'spec/requests/users_spec.rb'
            recipes:
              - 'app/controllers/**/recipes*'
              - 'app/models/recipe.rb'
              - 'spec/requests/recipes_spec.rb'

      # 手動実行時：指定のspecだけを回す（spec_pathが入っている場合）
      - name: Run selected specs (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.spec_path != ''
        run: bundle exec rspec "${{ inputs.spec_path }}" --format documentation --backtrace

      # PR/ブランチでは「触ったところだけ」を速く回す（fail-fast）
      - name: Run filtered specs (PR/branches, fast)
        if: (github.ref != 'refs/heads/main') && (github.event_name != 'workflow_dispatch')
        run: |
          ran=false

          if [ "${{ steps.filter.outputs.system }}" = "true" ]; then
            echo "[paths-filter] system 変更あり → spec/system を実行"
            bundle exec rspec spec/system --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          if [ "${{ steps.filter.outputs.admin }}" = "true" ]; then
            echo "[paths-filter] admin 変更あり → spec/requests/admin を実行"
            bundle exec rspec spec/requests/admin --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          if [ "${{ steps.filter.outputs.favorites }}" = "true" ]; then
            echo "[paths-filter] favorites 変更あり → favorites_spec を実行"
            bundle exec rspec spec/requests/favorites_spec.rb --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          if [ "${{ steps.filter.outputs.ratings }}" = "true" ]; then
            echo "[paths-filter] ratings 変更あり → ratings_spec を実行"
            bundle exec rspec spec/requests/ratings_spec.rb --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          if [ "${{ steps.filter.outputs.reports }}" = "true" ]; then
            echo "[paths-filter] reports 変更あり → reports_spec を実行"
            bundle exec rspec spec/requests/reports_spec.rb --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          if [ "${{ steps.filter.outputs.users }}" = "true" ]; then
            echo "[paths-filter] users 変更あり → users_spec を実行"
            bundle exec rspec spec/requests/users_spec.rb --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          if [ "${{ steps.filter.outputs.recipes }}" = "true" ]; then
            echo "[paths-filter] recipes 変更あり → recipes_spec を実行"
            bundle exec rspec spec/requests/recipes_spec.rb --format progress --fail-fast --backtrace || exit 1
            ran=true
          fi
          # どれにも当たらない場合は requests 全体を軽く回す
          if [ "$ran" = false ]; then
            echo "[paths-filter] 該当なし → requests 全体を実行"
            bundle exec rspec spec/requests --format progress --fail-fast --backtrace
          fi

      # mainではフル実行（品質担保）
      - name: Run specs (full on main)
        if: (github.ref == 'refs/heads/main') && (github.event_name != 'workflow_dispatch')
        run: bundle exec rspec --format documentation --backtrace